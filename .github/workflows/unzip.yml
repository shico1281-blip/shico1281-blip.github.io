name: Extract site zip
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site archive
        run: |
          if [ ! -f site-dist-for-drop.zip ]; then echo "No zip file found, nothing to do."; exit 0; fi
          unzip -o site-dist-for-drop.zip
          rm site-dist-for-drop.zip
          if [ -d dist ]; then mv dist/* .; rmdir dist; fi
          if [ ! -f index.html ]; then for d in */; do if [ -f "$d/index.html" ]; then mv "$d"/* .; rmdir "$d"; break; fi; done; fi
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit." || (git commit -m "Extract site files from zip" && git push)
